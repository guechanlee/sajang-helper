# 로컬에서 DB까지 한 번에 띄운다:  docker compose up --build   →  http://localhost:3000
# 아래 비밀번호는 내 PC에서만 쓰는 값이다. DB 포트는 밖으로 열지 않는다(앱 컨테이너만 접속).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: sajang
      MYSQL_USER: sajang
      MYSQL_PASSWORD: sajang-local-only
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-local-only --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://sajang:sajang-local-only@db:3306/sajang
      # 정부 공고 동기화용 기업마당 인증키. 같은 폴더의 .env 파일에 BIZINFO_API_KEY=키 로 적어 두면 들어간다(없어도 앱은 뜬다).
      BIZINFO_API_KEY: ${BIZINFO_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  dbdata:
